# Tier 1 of the test suite (tests/README.md): the library against the simulated MCA.
# No hardware; the tier-2 tests (tests/hw/) are skipped without --hw.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tier1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # installs the package from pyproject.toml, so the build is tested too
      - run: python -m pip install ".[test]" "numpy>=2"
      - name: import the installed package from outside the repository
        working-directory: ${{ runner.temp }}
        run: python -c "import MCA8000A, serial, numpy; print(MCA8000A.__file__)"
      - run: python -m pytest
