# Packaging: the library is the single module MCA8000A.py at the repository root.
#   pip install .               # the library
#   pip install -e ".[test]"    # editable, with the test tools
# Tests also run from a checkout without installing (pythonpath below).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mca8000a"
version = "0.1.0"
description = "Control an Amptek MCA8000A (USB serial variant) from Python"
readme = "README.md"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
authors = [{name = "Maurice Leutenegger"}]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.0",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout"]

[tool.setuptools]
py-modules = ["MCA8000A"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." for MCA8000A.py, "tests" for the simulator package (mcasim)
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
# pytest-timeout: a hung unit test is a bug (the simulator runs on virtual time).
# Hardware tests set their own limits.
timeout = 60
markers = [
    "hw: tier 2, needs a real MCA (--hw)",
    "hw_state: changes MCA settings and restores them (--hw-state)",
    "hw_delete: acquires in a scratch group and deletes its data and time (--hw-delete)",
    "hw_any_memory: may overwrite memory outside the scratch group (--hw-any-memory)",
    "hw_slow: takes minutes, e.g. waits for power-down (--hw-slow)",
]
